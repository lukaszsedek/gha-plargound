name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:          # manual full-history scan

permissions:
  contents: read
  pull-requests: write        # lets the action comment on the PR

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # required only for org-owned repos
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          # GITLEAKS_CONFIG: .gitleaks.toml   # only needed for a non-default path
          GITLEAKS_VERSION: latest          # or pin, e.g. 8.21.2
